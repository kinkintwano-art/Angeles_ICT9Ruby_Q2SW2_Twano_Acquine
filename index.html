<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Seatwork 2</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body{
			margin:0;
			font-family:Arial, sans-serif;}

		#topbar{background-color:#212529 !important; padding:8px 15px}
.logo {
			width:45px; height: 45px;
			border-radius:50%;
			background-color: white;} #topbar .nav-link{color:#ccc; font-size:15px}

		.searchbox{width:200px; padding:5px; border:none}
	.searchbutton{background-color:#0d6efd; color:white; padding:5px 10px; border:none; margin-left:5px}

#contact{
		  background-image:url("school.png");
		  height:600px; background-size: cover; }
	</style>
</head>
<body>






<nav class="navbar navbar-expand navbar-light bg-light" id="topbar">
	<a class="navbar-brand" href="#contact"><img class="logo" src="logo.png"></a>

<div class="collapse navbar-collapse">
<ul class="navbar-nav me-auto">
		<li class="nav-item"><a class="nav-link" href="#contact">Contact Us</a></li>
		</ul>
		<div>
			<input class="searchbox" type="text" placeholder="Search">
			<input class="searchbutton" type="button" value="Search">
		</div>
	</div>
</nav>

<div id="contact">
<div class="container">
<div class="row">
	<div class="col">
		<h1 style="background-color:white">School Office Hours</h1>
	<table class="table table-striped table-bordered">
		<tr><th>Day</th><th>Office Hours</th><th>Department</th></tr>
			<tr><td>Monday</td><td>8:00 AM - 4:00 PM</td><td>Registrar's Office</td></tr>
<tr><td>Tuesday</td><td>8:00 AM - 4:00 PM</td><td>Accounting Office</td></tr>
		<tr><td>Wednesday</td><td>8:00 AM - 4:00 PM</td><td>Guidance Office</td></tr>
			<tr><td>Thursday</td><td>8:00 AM - 4:00 PM</td><td>Principal's Office</td></tr>
		<tr><td>Friday</td><td>8:00 AM - 3:00 PM</td><td>Admin Office</td></tr>
	</table>
	</div>

	<div class="col" style="background-color:white">
		<h2>Contact Us</h2>
		<label class="form-label">Full name</label>
<input class="form-control" type="text">
			<label class="form-label">Email address</label>
	<input class="form-control" type="text">
<label class="form-label">Subject</label>
			<input class="form-control" type="text"> <label class="form-label">Message</label>
		<textarea class="form-control"></textarea>
	<input class="btn btn-primary" type="button" value="Send Message">
	</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
